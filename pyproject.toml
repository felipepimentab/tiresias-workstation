[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiresias-workstation"
version = "0.1.0"
description = "Cross-platform desktop application for the Tiresias DK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.0,<4",
    "PySide6>=6.8,<7",
]

[project.scripts]
tiresias-workstation = "tiresias_workstation.main:main"

[tool.setuptools.packages.find]
where = ["src"]

